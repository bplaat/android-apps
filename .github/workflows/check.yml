name: check

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format@23.1.1
        run: |
          python -m pip install clang-format==23.1.1
          clang-format --version
      - name: Install bob
        run: cargo install --git https://github.com/bplaat/crates.git bob
      - name: Run ./meta.sh check
        run: |
          ./meta.sh check
